<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>fixed: SW guard + retry/fallback img</title>
<style>
	body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
	h1 { font-size: 22px; margin: 0 0 4px; }
	p.sub { color: #555; margin: 0 0 16px; }
	#verdict { font-size: 30px; font-weight: 800; padding: 14px 18px; border-radius: 10px; margin-bottom: 16px; }
	#verdict.bad { background: #fdecea; color: #b3261e; border: 3px solid #b3261e; }
	#verdict.good { background: #e6f4ea; color: #1e7b34; border: 3px solid #1e7b34; }
	#verdict.running { background: #f1f3f4; color: #555; border: 3px solid #999; }
	.navbar-sim { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
	.entry { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #555; }
	.profile-entry { width: 64px; height: 64px; border-radius: 999px; background: #e5e7eb; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 28px; font-weight: 700; color: #111; }
	.profile-entry img { width: 100%; height: 100%; object-fit: cover; }
	pre { background: #111; color: #9fe8b5; padding: 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; min-height: 180px; }
</style>
</head>
<body>
<h1>Run 2 — fixed service worker (same-origin only) + retry-once / fallback &lt;img&gt; (TASK-4 + TASK-5)</h1>
<p class="sub">Same simulated cold-start failure: storage request destroyed at socket level once, then succeeds.</p>
<div id="verdict" class="running">running…</div>
<div class="navbar-sim">
	<div class="entry"><div class="profile-entry" id="holder"><img id="pic" alt="Profile" /></div>profile entry</div>
	<div class="entry"><div class="profile-entry"><img id="ok" alt="control" /></div>same-origin control</div>
</div>
<pre id="log"></pre>
<script>
	const logEl = document.getElementById('log');
	const lines = [];
	function log(line) {
		lines.push(new Date().toISOString().slice(11, 23) + '  ' + line);
		logEl.textContent = lines.join('\n');
	}
	function finish(state) {
		const v = document.getElementById('verdict');
		v.textContent = state;
		v.className = state.includes('BROKEN') || state.includes('ERROR') ? 'bad' : 'good';
		document.title = state;
		log('VERDICT: ' + state);
	}
	navigator.serviceWorker.addEventListener('message', (e) => log('sw   ' + e.data.msg));

	// mirrors the fixed NavProfileEntry.svelte: one retry with a cache-buster,
	// then the initial-letter placeholder instead of a broken image
	let attempts = 0;
	const BASE = 'http://127.0.0.1:8299/storage/user/pic.png';

	async function boot() {
		await navigator.serviceWorker.register('/fixed/sw.js', { scope: '/fixed/' });
		await navigator.serviceWorker.ready;
		if (!navigator.serviceWorker.controller) {
			await new Promise((r) => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }));
		}
		log('page controlled by service worker');
		await fetch('http://127.0.0.1:8299/ping', { mode: 'no-cors' });
		log('api re-armed: next storage request will fail at socket level');

		document.getElementById('ok').src = '/ok.png';

		const img = document.getElementById('pic');
		img.onload = () => finish(attempts === 0 ? 'PICTURE LOADED (first try)' : 'PICTURE LOADED (after one retry — self-healed, no reload needed)');
		img.onerror = () => {
			if (attempts < 1) {
				attempts += 1;
				log('img   error -> retrying once with ?retry=1 (fixed NavProfileEntry behaviour)');
				img.src = BASE + '?retry=' + attempts;
				return;
			}
			log('img   error again -> falling back to initial letter');
			img.remove();
			document.getElementById('holder').textContent = 'S';
			finish('FELL BACK TO LETTER (picture not available)');
		};
		img.src = BASE;
		log('img   src set');
	}
	boot().catch((e) => { log('boot error: ' + e); finish('HARNESS ERROR: ' + e.message); });
</script>
</body>
</html>
